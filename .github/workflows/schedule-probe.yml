name: schedule-probe
on:
  schedule:
    - cron: '35 14 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['trigger-probe.txt']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 探针
        run: echo "probe fired at $(date -u +%Y-%m-%dT%H:%M:%SZ) event=${{ github.event_name }}"
